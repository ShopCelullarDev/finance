# Pegar en el vhost del dominio, delante del DocumentRoot.
# Requiere mod_proxy, mod_proxy_http y mod_proxy_wsgi no; sí mod_proxy_wstunnel.
# Lo activa el administrador de CWP. El usuario finance no puede escribir este archivo.

ProxyPreserveHost On
RequestHeader set X-Forwarded-Proto "https"

ProxyPass        /api/   http://127.0.0.1:8000/api/
ProxyPassReverse /api/   http://127.0.0.1:8000/api/
ProxyPass        /health http://127.0.0.1:8000/health
ProxyPassReverse /health http://127.0.0.1:8000/health
ProxyPass        /robots.txt http://127.0.0.1:8000/robots.txt
ProxyPassReverse /robots.txt http://127.0.0.1:8000/robots.txt

ProxyPass        /ws/    ws://127.0.0.1:8000/ws/
ProxyPassReverse /ws/    ws://127.0.0.1:8000/ws/

ProxyPass        /      http://127.0.0.1:3000/
ProxyPassReverse /      http://127.0.0.1:3000/
